# dbt Schema Tests — Intermediate Layer

version: 2

models:
  - name: int_account_metrics
    description: >
      Enriched account data with derived metrics (age, inactivity,
      utilization, dormancy, high-balance flags) and formatted
      descriptions. Migrated from load_customer_accounts.sas (Step 2:
      DATA step business logic).
    columns:
      - name: account_id
        description: Primary key — carried through from staging.
        data_tests:
          - unique
          - not_null

      - name: acct_age_months
        description: >
          Account age in months. Replaces SAS intck('month', ...) call.
        data_tests:
          - not_null

      - name: dormancy_flag
        description: >
          Y/N flag for accounts inactive > 365 days. Replaces SAS
          DATA step IF/THEN assignment.
        data_tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']

      - name: high_balance_flag
        description: >
          Y/N flag for balances >= 250,000. Derived from SAS DATA step logic.
        data_tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']

      - name: account_type_desc
        description: >
          Human-readable account type. Generated by the format_account_type
          macro (replacement for SAS PROC FORMAT $ACCTTYPE).
        data_tests:
          - not_null

      - name: account_status_desc
        description: >
          Human-readable account status. Generated by the
          format_account_status macro (replacement for SAS $ACCTSTAT).
        data_tests:
          - not_null

      - name: customer_segment_desc
        description: >
          Human-readable customer segment. Generated by the
          format_customer_segment macro (replacement for SAS $CUSTSEG).
        data_tests:
          - not_null

  - name: int_account_exceptions
    description: >
      Data-quality exceptions raised by load_customer_accounts.sas (Step 2's
      exception branch, appended to STG_BANK.ACCT_EXCEPTIONS in Step 3). One
      row per rule that fires, so the grain is (account_id, exception_code).
      Source quirks reproduced and flagged in the model header: the SAS landing
      table loses EXCEPTION_CODE/EXCEPTION_DESC to a `drop` that applies to both
      output datasets, and exception rows carry no SNAPSHOT_DATE/LOAD_TIMESTAMP
      because both are assigned after the output statements.
      Grain (account_id, exception_code) is enforced by
      tests/reconcile_exception_detail_parity.sql, which compares the model to
      the rules re-evaluated on the raw source as a multiset.
    columns:
      - name: account_id
        data_tests:
          - not_null

      - name: exception_code
        description: >
          SAS rule that raised the row. Emission order within an account is
          NEG_BAL, HIGH_UTIL, NO_RISK.
        data_tests:
          - not_null
          - accepted_values:
              values: ['NEG_BAL', 'HIGH_UTIL', 'NO_RISK']

      - name: exception_desc
        description: >
          Message the SAS catx()/put() expression built for the rule.
        data_tests:
          - not_null

      - name: snapshot_date
        description: >
          Always null — SAS assigns SNAPSHOT_DATE after the exception rows are
          output, so they leave the DATA step missing it (source-faithful).

  - name: int_claims_adjudication
    description: >
      Claims with fraud screening and auto-adjudication results.
      Migrated from claims_processing.sas (Steps 2-4). SAS hash lookup
      and IF/THEN routing replaced by broadcast JOIN and SQL CASE.
    columns:
      - name: claim_id
        description: Primary key — unique claim identifier.
        data_tests:
          - unique
          - not_null

      - name: policy_id
        data_tests:
          - not_null

      - name: adjudication_result
        description: >
          Auto-adjudication outcome. Maps to SAS routing targets:
          AUTO_ADJUDICATED (APPR/DENY) or MANUAL_REVIEW (PEND).
        data_tests:
          - not_null
          - accepted_values:
              values: ['APPR', 'DENY', 'PEND']

      - name: fraud_risk
        description: >
          Fraud risk level derived from fraud_score thresholds.
          HIGH >= 80, MEDIUM >= 50, LOW < 50.
        data_tests:
          - not_null
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']

      - name: claimed_amount
        data_tests:
          - not_null

  - name: int_policy_valuation
    description: >
      In-force policy valuation with claims experience, premium collections,
      loss ratios, and reserve estimates. Migrated from policy_valuation.sas
      (Steps 1-4). SAS MERGE BY → SQL LEFT JOIN.
    columns:
      - name: policy_id
        description: Primary key — unique policy identifier.
        data_tests:
          - unique
          - not_null

      - name: policy_type
        description: Insurance line of business.
        data_tests:
          - not_null

      - name: annual_premium
        description: Must be positive for active policies.
        data_tests:
          - not_null

      - name: premium_adequate
        description: >
          Y if combined ratio <= 1.0, else N. Flags policies where
          premiums may be insufficient to cover losses.
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: renewal_due_flag
        description: >
          Y if policy expires within 3 months. Replaces SAS intck/intnx
          calculation.
        data_tests:
          - accepted_values:
              values: ['Y', 'N']
