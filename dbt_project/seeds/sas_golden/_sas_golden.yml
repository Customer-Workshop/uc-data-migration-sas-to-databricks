# SAS golden outputs (business date 31JAN2024) imported by seed/import_sas_golden.py.
# Provenance: verify/golden/manifest.json (estate commit, runtime, row counts).
# These are what the legacy programs produced; the parity tests in
# tests/reconcile_golden_*.sql compare the migrated models against them.

version: 2

seeds:
  - name: sas_golden_acct_exceptions
    description: "SAS output for ACCT_EXCEPTIONS — 32 rows."
    config:
      column_types:
        account_id: string
        customer_id: string
        account_type: string
        account_status: string
        open_date: date
        close_date: date
        current_balance: double
        available_balance: double
        credit_limit: double
        interest_rate: double
        branch_id: string
        officer_id: string
        last_activity_date: date
        first_name: string
        last_name: string
        ssn_hash: string
        date_of_birth: date
        customer_segment: string
        risk_rating: double
        region_code: string
        primary_email: string
        phone_number: string
        acct_age_months: double
        days_inactive: double
        utilization_pct: double
        dormancy_flag: string
        high_balance_flag: string
        snapshot_date: date
        load_timestamp: timestamp
