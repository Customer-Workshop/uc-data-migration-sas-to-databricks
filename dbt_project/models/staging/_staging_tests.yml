# dbt Schema Tests — Staging Layer
#
# SAS had no built-in data quality testing framework. Validation was done
# via ad hoc PROC SQL queries, PROC FREQ for value distributions, and
# manual review of PROC PRINT output. dbt makes data quality testing
# declarative, version-controlled, and automatically enforced on every run.

version: 2

models:
  - name: stg_cust_accounts
    description: >
      Customer account master joined with demographics.
      Migrated from load_customer_accounts.sas (Step 1: PROC SQL extract).
    columns:
      - name: account_id
        description: Primary key — unique account identifier.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Foreign key to customer demographics.
        data_tests:
          - not_null

      - name: account_type
        description: >
          Account type code. Maps to SAS PROC FORMAT $ACCTTYPE values.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - CHK
                - SAV
                - MMA
                - CD
                - IRA
                - LOC
                - MTG
                - AUTO
                - PERS
                - CC
                - HELC

      - name: account_status
        description: >
          Account status code. Maps to SAS PROC FORMAT $ACCTSTAT values.
          Note: 'W' (Written Off) and 'C' (Closed) are filtered out in
          the staging model, matching the SAS WHERE clause.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - A
                - D
                - F
                - R
                - S
                - P

      - name: open_date
        description: Account opening date.
        data_tests:
          - not_null

      - name: current_balance
        description: Current account balance.
        data_tests:
          - not_null

  - name: stg_daily_transactions
    description: >
      Validated daily transaction feed. Records failing validation are
      excluded (equivalent to the SAS DATA step routing rejects to
      WORK.TXN_REJECTED). Rejection reasons are evaluated but only
      passing records are emitted.
    columns:
      - name: transaction_id
        description: Primary key — unique transaction identifier.
        data_tests:
          - unique
          - not_null

      - name: account_id
        description: >
          Foreign key to stg_cust_accounts.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_cust_accounts')
              field: account_id
              config:
                severity: warn

      - name: transaction_type
        description: >
          Transaction type code. Maps to SAS PROC FORMAT $TXNCAT values.
          Only valid types pass the staging validation filter.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - DEP
                - WDR
                - TRF
                - PMT
                - FEE
                - INT
                - ADJ
                - REV
                - CHG
                - REF

      - name: transaction_amount
        description: Transaction amount (positive value).
        data_tests:
          - not_null

      - name: transaction_date
        description: Date the transaction occurred.
        data_tests:
          - not_null

  - name: stg_claims
    description: >
      Validated insurance claims with policy enrichment.
      Migrated from claims_processing.sas (Step 1). SAS hash object
      lookup to RAW_INS.POLICIES replaced by broadcast JOIN.
    columns:
      - name: claim_id
        description: >
          Primary key — unique claim identifier.
          Source: CLAIM_ID from RAW_INS.CLAIMS_FEED (SAS character → STRING).
        data_tests:
          - unique
          - not_null

      - name: policy_id
        description: >
          FK to policies table. Validated as active during ingestion via
          broadcast join (replaces SAS hash lookup on POLICY_ID with
          STATUS='ACTIVE' filter). Source: POLICY_ID from CLAIMS_FEED.
        data_tests:
          - not_null

      - name: claimant_id
        description: >
          Identifier of the person or entity filing the claim.
          Source: CLAIMANT_ID from RAW_INS.CLAIMS_FEED (SAS character → STRING).
        data_tests:
          - not_null

      - name: claim_type
        description: >
          Classification of the insurance claim (e.g., collision,
          liability, property). Source: CLAIM_TYPE from CLAIMS_FEED.
        data_tests:
          - not_null

      - name: claim_status
        description: >
          Current processing status. Maps to SAS PROC FORMAT $CLMSTAT
          values. Source: CLAIM_STATUS from CLAIMS_FEED.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - OPEN
                - CLOSED
                - PENDING
                - DENIED
                - SETTLED
                - REOPENED

      - name: claimed_amount
        description: >
          Dollar amount claimed by the policyholder. Validated to not
          exceed sum_insured. Source: CLAIMED_AMOUNT from CLAIMS_FEED
          (SAS numeric → DOUBLE).
        data_tests:
          - not_null

      - name: loss_date
        description: >
          Date the insured loss event occurred. Validated to fall within
          the policy effective period (EFFECTIVE_DATE to EXPIRATION_DATE).
          Source: LOSS_DATE from CLAIMS_FEED (SAS date numeric → DATE).
        data_tests:
          - not_null

      - name: reported_date
        description: >
          Date the claim was reported to the insurer.
          Source: REPORTED_DATE from CLAIMS_FEED (SAS date numeric → DATE).
        data_tests:
          - not_null

      - name: policy_type
        description: >
          Line of business for the associated policy (e.g., AUTO, HOME,
          RENT). Enriched via broadcast join to RAW_INS.POLICIES.
          Source: POLICY_TYPE (SAS character → STRING).
        data_tests:
          - not_null

      - name: effective_date
        description: >
          Start date of the policy coverage period. Used for loss-date
          validation. Source: EFFECTIVE_DATE from POLICIES
          (SAS date numeric → DATE).
        data_tests:
          - not_null

      - name: expiration_date
        description: >
          End date of the policy coverage period. Used for loss-date
          validation. Source: EXPIRATION_DATE from POLICIES
          (SAS date numeric → DATE).
        data_tests:
          - not_null

      - name: sum_insured
        description: >
          Maximum coverage amount on the policy. Used to validate
          claimed_amount and as adjudication threshold (25% rule).
          Source: SUM_INSURED from POLICIES (SAS numeric → DOUBLE).
        data_tests:
          - not_null

      - name: deductible
        description: >
          Policyholder's deductible amount, subtracted from the approved
          payout. Source: DEDUCTIBLE from POLICIES
          (SAS numeric → DOUBLE).
        data_tests:
          - not_null
