# dbt Schema Tests — Marts Layer

version: 2

models:
  - name: mart_daily_transactions
    description: >
      Enriched transaction records with running balances and pre/post
      transaction balances. Replaces PROC SQL enrichment join + DATA step
      RETAIN running balance from daily_transaction_processing.sas.
      Materialized as an incremental model (replaces PROC APPEND).
    columns:
      - name: transaction_id
        description: Primary key — unique transaction identifier.
        data_tests:
          - unique
          - not_null

      - name: account_id
        description: Foreign key to int_account_metrics.
        data_tests:
          - not_null

      - name: transaction_date
        description: Transaction date.
        data_tests:
          - not_null

      - name: transaction_type
        description: Transaction type code.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - DEP
                - WDR
                - TRF
                - PMT
                - FEE
                - INT
                - ADJ
                - REV
                - CHG
                - REF

      - name: running_balance
        description: >
          Cumulative balance after this transaction. Computed via SQL
          window function, replacing SAS RETAIN + BY-group logic.
        data_tests:
          - not_null

  - name: mart_risk_scores
    description: >
      Credit risk scores using WOE (Weight of Evidence) logistic
      regression scorecard. Migrated from credit_risk_scoring.sas.
      Computes PD (Probability of Default), LGD, EAD, and expected loss.
    columns:
      - name: account_id
        description: >
          Scored account identifier. Unique within one SCORE_DATE (the table
          is appended nightly like CURATED.RISK_SCORES, so uniqueness is
          asserted for the batch business date).
        data_tests:
          - not_null
          - unique:
              config:
                where: "score_date = to_date('{{ var('curr_dt') }}')"

      - name: pd
        description: >
          Probability of Default (0–1). Computed via logistic regression
          using WOE-binned features.
        data_tests:
          - not_null

      - name: new_risk_rating
        description: >
          Integer risk rating (1–7) derived from PD thresholds — SAS column
          NEW_RISK_RATING in CURATED.RISK_SCORES. Replaces the SAS DATA step
          IF/THEN rating assignment.
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7]

      - name: expected_loss
        description: >
          Expected loss = PD × LGD × EAD.
        data_tests:
          - not_null

  - name: mart_transaction_anomalies
    description: >
      Flagged anomalous transactions using Z-score and rule-based
      detection. Migrated from daily_transaction_processing.sas (Step 3:
      PROC SQL anomaly detection).
    columns:
      - name: transaction_id
        description: Primary key — the flagged transaction.
        data_tests:
          - not_null

      - name: anomaly_type
        description: >
          Classification of the anomaly detected.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - HIGH_AMOUNT
                - OVERDRAFT
                - LARGE_WITHDRAWAL
                - ORPHAN_ACCOUNT

  - name: mart_daily_transactions_curated
    description: >
      CURATED.DAILY_TRANSACTIONS contract — prior history plus today's
      validated feed in the ten feed columns (PROC APPEND FORCE drops the
      enrichment columns). Read next day for the 90-day anomaly statistics.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: transaction_amount
        data_tests:
          - not_null

  - name: mart_running_balances
    description: >
      CURATED.RUNNING_BALANCES — ACCOUNT_ID, TRANSACTION_DATE, TRANSACTION_ID,
      RUNNING_BALANCE for today's validated transactions (DATA step KEEP,
      table replaced each run).
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null

  - name: mart_risk_migration
    description: >
      CURATED.RISK_MIGRATION — accounts whose scorecard rating differs from
      the demographics RISK_RATING (or had none). Migrated from
      credit_risk_scoring.sas Step 3.
    columns:
      - name: account_id
        data_tests:
          - not_null
          - unique:
              config:
                where: "score_date = to_date('{{ var('curr_dt') }}')"
      - name: curr_rating
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7]
      - name: migration_direction
        data_tests:
          - not_null
          - accepted_values:
              values: ['NEW', 'UPGRADE', 'DOWNGRADE', 'STABLE']

  - name: mart_risk_summary
    description: >
      REPORTS.RISK_SUMMARY — PROC MEANS NWAY by ACCOUNT_TYPE, NEW_RISK_RATING.
      Columns LGD/EAD/EXPECTED_LOSS hold N counts (SAS output-statement
      naming quirk, see model header).
    columns:
      - name: account_type
        data_tests:
          - not_null
      - name: new_risk_rating
        data_tests:
          - not_null
      - name: n_accounts
        data_tests:
          - not_null

  - name: mart_regulatory_rwa
    description: >
      Monthly Risk-Weighted Assets by account type and segment.
      Basel III standardized approach risk weights.
      Migrated from monthly_regulatory_reporting.sas (Step 1).
    columns:
      - name: report_month
        description: Reporting period (YYYYMM).
        data_tests:
          - not_null

      - name: account_type
        data_tests:
          - not_null

      - name: risk_weight
        description: Basel III risk weight (0.00–1.00).
        data_tests:
          - not_null

      - name: total_exposure
        description: Sum of current_balance for the group.
        data_tests:
          - not_null

      - name: rwa
        description: Risk-weighted assets = exposure × risk_weight.
        data_tests:
          - not_null

      - name: customer_segment
        data_tests:
          - not_null

  - name: mart_capital_adequacy
    description: >
      REPORTS.CAPITAL_ADEQUACY — one row per report month: TOTAL_RWA,
      placeholder capital figures, ratios (x100) and PASS/FAIL against the
      4.5% / 6.0% / 8.0% minimums. Migrated from
      monthly_regulatory_reporting.sas Step 5.
    columns:
      - name: report_month
        data_tests:
          - unique
          - not_null
      - name: cet1_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['PASS', 'FAIL']
      - name: tier1_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['PASS', 'FAIL']
      - name: total_capital_status
        data_tests:
          - not_null
          - accepted_values:
              values: ['PASS', 'FAIL']

  - name: mart_delinquency_aging
    description: >
      Delinquency aging buckets (Current/1-29/30-59/60-89/90-119/120-179/180+).
      Migrated from monthly_regulatory_reporting.sas (Step 2).
      SQL CASE replaces SAS bucket assignment, SQL GROUP BY replaces
      PROC SQL aggregation.
    columns:
      - name: report_month
        data_tests:
          - not_null

      - name: delinq_bucket
        description: Delinquency aging bucket.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - Current
                - 1-29
                - 30-59
                - 60-89
                - 90-119
                - 120-179
                - 180+
                - Unknown

      - name: n_accounts
        description: Count of accounts in bucket.
        data_tests:
          - not_null

      - name: total_balance
        description: Sum of balances in bucket.
        data_tests:
          - not_null

      - name: bucket_sort_order
        description: >
          Severity rank used by the SAS ORDER BY (Current=0 ... 180+=6,
          Unknown=7). Added column; tables have no intrinsic order.
        data_tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6, 7]

      - name: account_type
        data_tests:
          - not_null
          - accepted_values:
              values: ['MTG', 'AUTO', 'PERS', 'CC', 'LOC', 'HELC']

  - name: mart_llp_coverage
    description: >
      REPORTS.LLP_COVERAGE — loan loss provision coverage by ACCOUNT_TYPE
      (lending products with a LOAN_DETAILS row). Migrated from
      monthly_regulatory_reporting.sas Step 3.
    columns:
      - name: account_type
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values: ['MTG', 'AUTO', 'PERS', 'CC', 'LOC', 'HELC']
      - name: n_loans
        data_tests:
          - not_null
      - name: coverage_pct
        data_tests:
          - not_null
      - name: npl_coverage_pct
        data_tests:
          - not_null

  - name: mart_loss_ratios
    description: >
      Loss ratio summary by line of business (policy type).
      Migrated from policy_valuation.sas (Step 5). PROC MEANS
      aggregation replaced by SQL GROUP BY.
    columns:
      - name: policy_type
        description: Insurance line of business.
        data_tests:
          - unique
          - not_null

      - name: n_policies
        description: Count of in-force policies.
        data_tests:
          - not_null

      - name: total_earned
        description: Total YTD earned premium.

      - name: agg_loss_ratio
        description: Aggregate loss ratio = total_incurred / total_earned.

      - name: agg_combined_ratio
        description: Aggregate combined ratio = loss_ratio + 30% expense load.

  - name: mart_customer_pnl
    description: >
      Customer-level P&L: interest income, fees, credit loss, net profit.
      Migrated from customer_profitability.sas (Steps 1-4). Multi-source
      SAS MERGE BY → multi-ref LEFT JOIN.
    columns:
      - name: customer_id
        description: Primary key — unique customer.
        data_tests:
          - unique
          - not_null

      - name: report_month
        data_tests:
          - not_null

      - name: net_interest_income
        description: Lending income minus deposit cost.
        data_tests:
          - not_null

      - name: total_revenue
        description: Net interest income + fee income.
        data_tests:
          - not_null

      - name: net_profit
        description: Total revenue - operating cost - ECL.
        data_tests:
          - not_null

      - name: profit_tier
        description: >
          Profitability classification derived from net_profit thresholds.
          Replaces SAS DATA step IF/THEN tier assignment.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - Highly Profitable
                - Profitable
                - Marginal
                - Unprofitable
