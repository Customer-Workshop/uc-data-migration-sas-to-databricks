# dbt Schema Tests — Staging Layer
#
# SAS had no built-in data quality testing framework. Validation was done
# via ad hoc PROC SQL queries, PROC FREQ for value distributions, and
# manual review of PROC PRINT output. dbt makes data quality testing
# declarative, version-controlled, and automatically enforced on every run.

version: 2

models:
  - name: stg_cust_accounts
    description: >
      Customer account master joined with demographics.
      Migrated from load_customer_accounts.sas (Step 1: PROC SQL extract).
    columns:
      - name: account_id
        description: Primary key — unique account identifier.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Foreign key to customer demographics.
        data_tests:
          - not_null

      - name: account_type
        description: >
          Account type code. Maps to SAS PROC FORMAT $ACCTTYPE values.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - CHK
                - SAV
                - MMA
                - CD
                - IRA
                - LOC
                - MTG
                - AUTO
                - PERS
                - CC
                - HELC

      - name: account_status
        description: >
          Account status code. Maps to SAS PROC FORMAT $ACCTSTAT values.
          Note: 'W' (Written Off) and 'C' (Closed) are filtered out in
          the staging model, matching the SAS WHERE clause.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - A
                - D
                - F
                - R
                - S
                - P

      - name: open_date
        description: Account opening date.
        data_tests:
          - not_null

      - name: current_balance
        description: Current account balance.
        data_tests:
          - not_null

  - name: stg_daily_transactions
    description: >
      Validated daily transaction feed. Records failing validation are
      excluded (equivalent to the SAS DATA step routing rejects to
      WORK.TXN_REJECTED). Rejection reasons are evaluated but only
      passing records are emitted.
    columns:
      - name: transaction_id
        description: Primary key — unique transaction identifier.
        data_tests:
          - unique
          - not_null

      - name: account_id
        description: >
          Foreign key to stg_cust_accounts.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_cust_accounts')
              field: account_id
              config:
                severity: warn

      - name: transaction_type
        description: >
          Transaction type code. Maps to SAS PROC FORMAT $TXNCAT values.
          Only valid types pass the staging validation filter.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - DEP
                - WDR
                - TRF
                - PMT
                - FEE
                - INT
                - ADJ
                - REV
                - CHG
                - REF

      - name: transaction_amount
        description: Transaction amount (positive value).
        data_tests:
          - not_null

      - name: transaction_date
        description: Date the transaction occurred.
        data_tests:
          - not_null

  - name: stg_claims
    description: >
      Validated insurance claims with policy enrichment.
      Migrated from claims_processing.sas (Step 1). SAS hash object
      lookup to RAW_INS.POLICIES replaced by broadcast JOIN.
    columns:
      - name: claim_id
        description: Primary key — unique claim identifier.
        data_tests:
          - unique
          - not_null

      - name: policy_id
        description: FK to policies — validated as active during ingestion.
        data_tests:
          - not_null

      - name: claimant_id
        description: FK to claimant who filed the claim.
        data_tests:
          - not_null

      - name: claim_type
        description: >
          Type of insurance claim.
        data_tests:
          - not_null

      - name: claim_status
        description: >
          Claim processing status. Maps to SAS PROC FORMAT $CLMSTAT values.
        data_tests:
          - not_null
          - accepted_values:
              values:
                - OPEN
                - CLOSED
                - PENDING
                - DENIED
                - SETTLED
                - REOPENED

      - name: claimed_amount
        description: Amount claimed — validated to not exceed sum_insured.
        data_tests:
          - not_null

      - name: loss_date
        description: Date of loss — validated within policy period.
        data_tests:
          - not_null

      - name: reported_date
        description: Date the claim was reported.
        data_tests:
          - not_null

  - name: stg_policies
    description: >
      In-force insurance policies with derived valuation fields.
      Migrated from policy_valuation.sas (Step 1: PROC SQL extract).
      Filters to active policies within their effective period and
      computes policy_age_months, months_to_expiry, renewal_due_flag,
      and ytd_earned_premium.
    columns:
      - name: policy_id
        description: Primary key — unique policy identifier.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: FK to customer who holds the policy.
        data_tests:
          - not_null

      - name: policy_type
        description: >
          Insurance line of business. Maps to SAS PROC FORMAT $POLTYPE.
        data_tests:
          - not_null

      - name: annual_premium
        description: Annual premium amount — must be positive for in-force.
        data_tests:
          - not_null

      - name: renewal_due_flag
        description: >
          Y if policy expires within 3 months. Replaces SAS intnx() check.
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: ytd_earned_premium
        description: >
          Year-to-date earned premium (monthly pro-rata). Replaces SAS
          intck-based earned premium calculation.
