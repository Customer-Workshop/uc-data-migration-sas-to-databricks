# dbt Schema Tests — Intermediate Layer

version: 2

models:
  - name: int_account_metrics
    description: >
      Enriched account data with derived metrics (age, inactivity,
      utilization, dormancy, high-balance flags) and formatted
      descriptions. Migrated from load_customer_accounts.sas (Step 2:
      DATA step business logic).
    columns:
      - name: account_id
        description: Primary key — carried through from staging.
        data_tests:
          - unique
          - not_null

      - name: acct_age_months
        description: >
          Account age in months. Replaces SAS intck('month', ...) call.
        data_tests:
          - not_null

      - name: dormancy_flag
        description: >
          Y/N flag for accounts inactive > 365 days. Replaces SAS
          DATA step IF/THEN assignment.
        data_tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']

      - name: high_balance_flag
        description: >
          Y/N flag for balances >= 250,000. Derived from SAS DATA step logic.
        data_tests:
          - not_null
          - accepted_values:
              values: ['Y', 'N']

      - name: account_type_desc
        description: >
          Human-readable account type. Generated by the format_account_type
          macro (replacement for SAS PROC FORMAT $ACCTTYPE).
        data_tests:
          - not_null

      - name: account_status_desc
        description: >
          Human-readable account status. Generated by the
          format_account_status macro (replacement for SAS $ACCTSTAT).
        data_tests:
          - not_null

      - name: customer_segment_desc
        description: >
          Human-readable customer segment. Generated by the
          format_customer_segment macro (replacement for SAS $CUSTSEG).
        data_tests:
          - not_null

  - name: int_claims_adjudication
    description: >
      Claims with fraud screening and auto-adjudication results.
      Migrated from claims_processing.sas (Steps 2-4). SAS hash lookup
      and IF/THEN routing replaced by broadcast JOIN and SQL CASE.
    columns:
      - name: claim_id
        description: >
          Primary key — unique claim identifier, carried from stg_claims.
          Source: CLAIM_ID (STRING).
        data_tests:
          - unique
          - not_null

      - name: policy_id
        description: >
          Policy identifier — carried from stg_claims.
          Source: POLICY_ID (STRING).
        data_tests:
          - not_null

      - name: claimant_id
        description: >
          Claimant identifier — carried from stg_claims.
          Source: CLAIMANT_ID (STRING).

      - name: claim_type
        description: >
          Claim classification — carried from stg_claims.
          Source: CLAIM_TYPE (STRING).

      - name: claimed_amount
        description: >
          Original dollar amount claimed by the policyholder, carried
          from stg_claims. Source: CLAIMED_AMOUNT (DOUBLE).
        data_tests:
          - not_null

      - name: loss_date
        description: >
          Date of the insured loss event — carried from stg_claims.
          Source: LOSS_DATE (DATE).

      - name: reported_date
        description: >
          Date the claim was reported — carried from stg_claims.
          Source: REPORTED_DATE (DATE).

      - name: claim_status
        description: >
          Current processing status — carried from stg_claims.
          Source: CLAIM_STATUS (STRING).

      - name: policy_type
        description: >
          Policy line of business — carried from stg_claims. Used in
          auto-approval rules (AUTO, HOME, RENT eligible).
          Source: POLICY_TYPE (STRING).

      - name: sum_insured
        description: >
          Maximum policy coverage — used in the 25% threshold rule.
          Source: SUM_INSURED (DOUBLE).

      - name: deductible
        description: >
          Policyholder deductible — subtracted from claimed_amount to
          compute approved_amount. Source: DEDUCTIBLE (DOUBLE).

      - name: fraud_score
        description: >
          Numeric fraud propensity score from the fraud model, joined
          via left join on POLICY_ID + CLAIMANT_ID from
          TERA_DW.FRAUD_INDICATORS. NULL when no match (INT).

      - name: indicator_flags
        description: >
          Fraud indicator codes from TERA_DW.FRAUD_INDICATORS.
          NULL when no match (STRING).

      - name: fraud_risk
        description: >
          Fraud risk tier derived from fraud_score thresholds:
          HIGH (≥ 80), MEDIUM (≥ 50), LOW (< 50). Defaults to LOW
          when fraud_score is NULL. Replaces SAS IF/THEN with SQL CASE.
        data_tests:
          - not_null
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']

      - name: adjudication_result
        description: >
          Auto-adjudication outcome. APPR = auto-approved, DENY =
          auto-denied (high fraud risk), PEND = routed to manual review.
          Maps to SAS routing targets: AUTO_ADJUDICATED vs MANUAL_REVIEW.
        data_tests:
          - not_null
          - accepted_values:
              values: ['APPR', 'DENY', 'PEND']

      - name: adjudication_reason
        description: >
          Human-readable explanation of the adjudication decision.
          Built from multiple conditions via concat_ws (replaces SAS
          catx / ifc logic). Always populated (STRING).

      - name: approved_amount
        description: >
          Approved payout amount. GREATEST(0, claimed_amount - deductible)
          for APPR; 0 for DENY; NULL for PEND. Source: derived (DOUBLE).

      - name: processing_date
        description: >
          Date the claim was processed through the adjudication pipeline.
          Replaces SAS macro variable &proc_date. Source: derived (DATE).

  - name: int_policy_valuation
    description: >
      In-force policy valuation with claims experience, premium collections,
      loss ratios, and reserve estimates. Migrated from policy_valuation.sas
      (Steps 1-4). SAS MERGE BY → SQL LEFT JOIN.
    columns:
      - name: policy_id
        description: Primary key — unique policy identifier.
        data_tests:
          - unique
          - not_null

      - name: policy_type
        description: Insurance line of business.
        data_tests:
          - not_null

      - name: annual_premium
        description: Must be positive for active policies.
        data_tests:
          - not_null

      - name: premium_adequate
        description: >
          Y if combined ratio <= 1.0, else N. Flags policies where
          premiums may be insufficient to cover losses.
        data_tests:
          - accepted_values:
              values: ['Y', 'N']

      - name: renewal_due_flag
        description: >
          Y if policy expires within 3 months. Replaces SAS intck/intnx
          calculation.
        data_tests:
          - accepted_values:
              values: ['Y', 'N']
