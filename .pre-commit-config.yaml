# Pre-commit hooks for dbt/Databricks project
# SAS had no pre-commit equivalent — code style was not enforced.
# These hooks catch linting issues before code is committed.

repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.0
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff-lint
        files: dbt_project/models/
        args:
          - --config
          - .sqlfluff
          # Match CI: lint with the jinja templater, ignoring templating/parsing
          # so dbt macro expansion doesn't require a live connection.
          - --ignore
          - templating,parsing
        additional_dependencies:
          - dbt-core
          - dbt-databricks
          - sqlfluff-templater-dbt

      - id: sqlfluff-fix
        name: sqlfluff-fix
        files: dbt_project/models/
        args:
          - --config
          - .sqlfluff
          # Match CI: ignore templating/parsing so dbt macro expansion doesn't
          # require a live connection.
          - --ignore
          - templating,parsing
          # Suppress the interactive "are you sure?" prompt so the hook can
          # apply fixes non-interactively.
          - --force
        additional_dependencies:
          - dbt-core
          - dbt-databricks
          - sqlfluff-templater-dbt

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - -d
          - '{extends: relaxed, rules: {line-length: {max: 200}}}'
        files: \.(yml|yaml)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
